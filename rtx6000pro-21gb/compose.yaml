services:
  qwen:
    image: ghcr.io/kobusg/ninfer-sm120a-quant-kv@sha256:c711bf570c2de3a0ce0815ddb2d6707231507b588c0e845aac044106af0c368d
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      NINFER_ENABLE_SSH: "0"
      NINFER_HF_REPO: neroued/Qwen3.8-27B-NInfer
      NINFER_MODEL_FILE: qwen3_8_27b.ninfer
      NINFER_MODEL_SHA256: eec39564993d6e9c7d5e383382a760f093465c9d163ec9a1bd6b80199514bf3e
      NINFER_MODEL_ID: qwen3.8-27b
      NINFER_MAX_CONTEXT: "145920"
      NINFER_KV_CAPACITY: "145920"
      NINFER_KV_DTYPE: rk4v4-e8
      NINFER_MAX_CONCURRENCY: "2"
      NINFER_PREFILL_CHUNK: "512"
      NINFER_VISION: "1"
      NINFER_VISION_MAX_TOKENS: "8192"
      NINFER_SPEC: mtp
      NINFER_DRAFT_TOKENS: "3"
    volumes:
      - qwen-models:/models
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qwen-models:
