services:
  qwen:
    image: ghcr.io/kobusg/ninfer-sm120a-quant-kv@sha256:d7300f8d8abc3399f8147eecb3f551ee261552309d14730b008955f97e6a9acf
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      NINFER_ENABLE_SSH: "0"
      NINFER_HF_REPO: neroued/Qwen3.8-27B-nvfp4-NInfer
      NINFER_MODEL_FILE: qwen3_8_27b_nvfp4.ninfer
      NINFER_MODEL_SHA256: bb3360522a06e136e0367f5703414d26272b7285c8a6ab6194135c17dbd81b32
      NINFER_MODEL_ID: qwen3.8-27b
      NINFER_CHAT_TEMPLATE: /usr/share/doc/ninfer/froggeric-chat-template.jinja
      NINFER_REASONING_EFFORT: medium
      NINFER_MAX_CONTEXT: "524288"
      NINFER_KV_CAPACITY: "524288"
      NINFER_KV_DTYPE: rk4v4-e8
      NINFER_MAX_CONCURRENCY: "2"
      NINFER_PREFILL_CHUNK: "1024"
      NINFER_VISION: "1"
      NINFER_VISION_MAX_TOKENS: "8192"
      NINFER_SPEC: mtp
      NINFER_DRAFT_TOKENS: "3"
    volumes:
      - qwen-models:/models
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 180s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qwen-models:
